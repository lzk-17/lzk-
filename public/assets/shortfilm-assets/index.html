<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f0f" />
    <title>23:17 · 视觉资产</title>
    <style>
      :root { color-scheme:dark; --ink:#0d0f0f; --paper:#f0eee7; --muted:#9da5a0; --coral:#f18268; --line:rgba(240,238,231,.16); }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--ink); color:var(--paper); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
      header { position:sticky; top:0; z-index:2; display:flex; align-items:end; justify-content:space-between; gap:24px; padding:32px max(24px,4vw); border-bottom:1px solid var(--line); background:rgba(13,15,15,.88); backdrop-filter:blur(16px); }
      h1 { margin:0; font-size:clamp(34px,5vw,74px); line-height:.92; letter-spacing:-.06em; }
      header p { margin:0; color:var(--muted); font-size:12px; }
      main { width:min(calc(100% - 48px),1600px); margin:64px auto 100px; }
      section + section { margin-top:92px; }
      h2 { margin:0 0 24px; color:var(--coral); font-size:12px; font-weight:500; letter-spacing:.12em; }
      .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
      figure { margin:0; border:1px solid var(--line); background:#151818; }
      img { display:block; width:100%; aspect-ratio:3/4; object-fit:cover; background:#151818; }
      .scenes img { aspect-ratio:16/10; }
      figcaption { padding:14px 16px 16px; color:var(--muted); font-size:12px; }
      @media (max-width:760px) { header { align-items:start; flex-direction:column; } .grid { grid-template-columns:1fr; } main { margin-top:40px; } }
    </style>
  </head>
  <body>

          <figure><img src="顾沉.webp" alt="顾沉角色设定" width="1200" height="1600" loading="lazy" decoding="async" /><figcaption>顾沉</figcaption></figure>

        </div>
      </section>
    </main>
  </body>
</html>
